name: citypass

services:
  mysql:
    image: mysql:8.0.36
    command:
      - --default-authentication-plugin=mysql_native_password
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: citypass
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/citypass.sql:/docker-entrypoint-initdb.d/00-citypass.sql:ro
      - ./deploy/mysql/migration-v6-story-files.sql:/docker-entrypoint-initdb.d/02-story-files.sql:ro
      - ./deploy/mysql/01-canal-user.sql:/docker-entrypoint-initdb.d/01-canal-user.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: citypass-minio-local:2025-04-22
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-citypass-local}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-citypass-local-change-me}"
      MINIO_API_CORS_ALLOW_ORIGIN: "${STORY_CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}"
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: citypass-minio-local:2025-04-22
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET" &&
        mc anonymous set none "local/$$OBJECT_STORAGE_BUCKET"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-citypass-local}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-citypass-local-change-me}"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-citypass-story-files}"
    depends_on:
      minio:
        condition: service_healthy

  namesrv:
    image: apache/rocketmq:4.9.7
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx128m -Xmn64m
    ports:
      - "${NAMESRV_HOST_PORT:-9876}:9876"

  rocketmq-init:
    image: alpine:3.20
    user: "0:0"
    command: sh -c "chown -R 3000:3000 /home/rocketmq/store"
    volumes:
      - rocketmq-store:/home/rocketmq/store

  broker:
    image: apache/rocketmq:4.9.7
    command: sh mqbroker -c /home/rocketmq/rocketmq-4.9.7/conf/broker.conf
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m
    ports:
      - "${BROKER_FAST_HOST_PORT:-10909}:10909"
      - "${BROKER_HOST_PORT:-10911}:10911"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/rocketmq-4.9.7/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    depends_on:
      namesrv:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: "${APP_DOCKERFILE:-Dockerfile}"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/citypass?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_COMMAND_TIMEOUT: "${REDIS_COMMAND_TIMEOUT:-1s}"
      CACHE_REDIS_FAILURE_THRESHOLD: "${CACHE_REDIS_FAILURE_THRESHOLD:-3}"
      CACHE_REDIS_OPEN_DURATION_MS: "${CACHE_REDIS_OPEN_DURATION_MS:-3000}"
      CACHE_REDIS_COMMAND_TIMEOUT_MS: "${CACHE_REDIS_COMMAND_TIMEOUT_MS:-1000}"
      CACHE_DB_FALLBACK_MAX_CONCURRENCY: "${CACHE_DB_FALLBACK_MAX_CONCURRENCY:-8}"
      CACHE_LOCK_WAIT_ATTEMPTS: "${CACHE_LOCK_WAIT_ATTEMPTS:-20}"
      CACHE_LOCK_WAIT_MIN_DELAY_MS: "${CACHE_LOCK_WAIT_MIN_DELAY_MS:-25}"
      CACHE_LOCK_WAIT_MAX_DELAY_MS: "${CACHE_LOCK_WAIT_MAX_DELAY_MS:-50}"
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_NAME_SERVER: namesrv:9876
      GATEWAY_CACHE_PURGE_URLS: "${GATEWAY_CACHE_PURGE_URLS:-http://openresty/internal/cache/venue}"
      GATEWAY_CACHE_PURGE_URL: "${GATEWAY_CACHE_PURGE_URL:-}"
      CANAL_ENABLED: "${CANAL_ENABLED:-false}"
      RELIABLE_TASK_ADMIN_TOKEN: "${RELIABLE_TASK_ADMIN_TOKEN:-}"
      OBJECT_STORAGE_PROVIDER: "${OBJECT_STORAGE_PROVIDER:-minio}"
      OBJECT_STORAGE_ENDPOINT: "${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}"
      OBJECT_STORAGE_PUBLIC_ENDPOINT: "${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-citypass-story-files}"
      OBJECT_STORAGE_REGION: "${OBJECT_STORAGE_REGION:-us-east-1}"
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:-citypass-local}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:-citypass-local-change-me}"
      STORY_DEBUG_PAGE_ENABLED: "${STORY_DEBUG_PAGE_ENABLED:-true}"
      STORY_FILE_UPLOAD_SECONDS: "${STORY_FILE_UPLOAD_SECONDS:-300}"
      STORY_FILE_CLEANUP_GRACE_SECONDS: "${STORY_FILE_CLEANUP_GRACE_SECONDS:-120}"
      STORY_FILE_READ_SECONDS: "${STORY_FILE_READ_SECONDS:-120}"
      STORY_FILE_TOMBSTONE_RESCAN_SECONDS: "${STORY_FILE_TOMBSTONE_RESCAN_SECONDS:-3600}"
      STORY_FILE_MAX_BYTES: "${STORY_FILE_MAX_BYTES:-10485760}"
      STORY_FILE_MAX_PIXELS: "${STORY_FILE_MAX_PIXELS:-20000000}"
      STORY_FILE_MAX_DIMENSION: "${STORY_FILE_MAX_DIMENSION:-10000}"
      STORY_FILE_MAX_IMAGES: "${STORY_FILE_MAX_IMAGES:-9}"
      STORY_FILE_PENDING_QUOTA: "${STORY_FILE_PENDING_QUOTA:-20}"
      STORY_FILE_DRAFT_HOURS: "${STORY_FILE_DRAFT_HOURS:-24}"
      STORY_FILE_CONFIRMATION_LEASE_SECONDS: "${STORY_FILE_CONFIRMATION_LEASE_SECONDS:-60}"
      STORY_FILE_IO_CONCURRENCY: "${STORY_FILE_IO_CONCURRENCY:-4}"
      CITYPASS_UPLOAD_DIR: /app/data/images
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai -Xms128m -Xmx384m
    ports:
      - "${APP_HOST_PORT:-8081}:8081"
    volumes:
      - app-images:/app/data/images
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  openresty:
    image: openresty/openresty:1.25.3.2-alpine
    environment:
      VENUE_READ_RATE_PER_SECOND: "${VENUE_READ_RATE_PER_SECOND:-60}"
      VENUE_READ_BURST: "${VENUE_READ_BURST:-120}"
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:80"
    volumes:
      - ./src/main/resources/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./src/main/resources/openresty/lua:/usr/local/openresty/nginx/lua:ro
    depends_on:
      - app

  # 可选：docker compose --profile canal up -d --build
  canal:
    image: canal/canal-server:v1.1.7
    profiles: ["canal"]
    environment:
      - canal.auto.scan=false
      - canal.destinations=citypass
      - canal.serverMode=rocketMQ
      - canal.mq.flatMessage=true
      - canal.mq.servers=namesrv:9876
      - rocketmq.namesrv.addr=namesrv:9876
      - canal.instance.master.address=mysql:3306
      - canal.instance.dbUsername=canal
      - canal.instance.dbPassword=canal
      - canal.instance.connectionCharset=UTF-8
      - canal.instance.gtidon=false
      - canal.instance.filter.regex=citypass\.tb_venue
      - canal.mq.topic=canal-binlog-topic
      - canal.mq.partition=0
    depends_on:
      mysql:
        condition: service_healthy
      broker:
        condition: service_healthy

volumes:
  minio-data:
  mysql-data:
  redis-data:
  rocketmq-store:
  app-images:
