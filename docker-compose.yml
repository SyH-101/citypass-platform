name: citypass

services:
  mysql:
    image: mysql:8.0.36
    command:
      - --default-authentication-plugin=mysql_native_password
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: citypass
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/citypass.sql:/docker-entrypoint-initdb.d/00-citypass.sql:ro
      - ./deploy/mysql/01-canal-user.sql:/docker-entrypoint-initdb.d/01-canal-user.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    build:
      context: .
      dockerfile: deploy/elasticsearch/Dockerfile
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      action.auto_create_index: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 40

  namesrv:
    image: apache/rocketmq:4.9.7
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-init:
    image: alpine:3.20
    user: "0:0"
    command: sh -c "chown -R 3000:3000 /home/rocketmq/store"
    volumes:
      - rocketmq-store:/home/rocketmq/store

  broker:
    image: apache/rocketmq:4.9.7
    command: sh mqbroker -c /home/rocketmq/rocketmq-4.9.7/conf/broker.conf
    environment:
      NAMESRV_ADDR: namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/rocketmq-4.9.7/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    depends_on:
      namesrv:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: "${APP_DOCKERFILE:-Dockerfile}"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/citypass?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 123456
      REDIS_HOST: redis
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_NAME_SERVER: namesrv:9876
      GATEWAY_CACHE_PURGE_URL: http://openresty/internal/cache/venue
      CANAL_ENABLED: "${CANAL_ENABLED:-false}"
      RELIABLE_TASK_ADMIN_TOKEN: "${RELIABLE_TASK_ADMIN_TOKEN:-}"
      SEARCH_ENABLED: "${SEARCH_ENABLED:-false}"
      SEARCH_HOSTS: http://elasticsearch:9200
      SEARCH_CURSOR_SECRET: "${SEARCH_CURSOR_SECRET:-}"
      SEARCH_PIT_KEEP_ALIVE_SECONDS: "${SEARCH_PIT_KEEP_ALIVE_SECONDS:-60}"
      CITYPASS_UPLOAD_DIR: /app/data/images
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
    ports:
      - "8081:8081"
    volumes:
      - app-images:/app/data/images
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy

  openresty:
    image: openresty/openresty:1.25.3.2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src/main/resources/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./src/main/resources/openresty/lua:/usr/local/openresty/nginx/lua:ro
    depends_on:
      - app

  # 可选：docker compose --profile canal up -d --build
  canal:
    image: canal/canal-server:v1.1.7
    profiles: ["canal"]
    environment:
      - canal.auto.scan=false
      - canal.destinations=citypass
      - canal.serverMode=rocketMQ
      - canal.mq.flatMessage=true
      - canal.mq.servers=namesrv:9876
      - rocketmq.namesrv.addr=namesrv:9876
      - canal.instance.master.address=mysql:3306
      - canal.instance.dbUsername=canal
      - canal.instance.dbPassword=canal
      - canal.instance.connectionCharset=UTF-8
      - canal.instance.gtidon=false
      - canal.instance.filter.regex=citypass\.tb_venue
      - canal.mq.topic=canal-binlog-topic
      - canal.mq.partition=0
    depends_on:
      mysql:
        condition: service_healthy
      broker:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
  app-images:
  elasticsearch-data:
