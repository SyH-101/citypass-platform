# ============================================================
# OpenResty 配置 — L1 缓存 + 网关令牌桶（二级限流第一层）
# 部署：将 lua/ 放到 OpenResty 可读路径，修改 lua_package_path 后 reload
# ============================================================

worker_processes  4;
pid /var/run/nginx.pid;

events {
    worker_connections  10240;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/json;

    # ── 共享字典 ──
    lua_shared_dict venue_cache   128m;
    lua_shared_dict lock_dict     16m;
    # 网关令牌桶状态（按 IP）
    lua_shared_dict rate_limit    16m;

    # ── Lua 脚本路径（按实际部署目录调整）──
    # 开发可将本仓库 src/main/resources/openresty/lua 拷到机器上
    lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/openresty/nginx/lua/?.lua;;";

    upstream java_backend {
        server app:8081 weight=1;
        # server 127.0.0.1:8082 weight=1;
    }

    server {
        listen 80;

        # ── 限量预约入口：网关全局令牌桶（所有请求共一桶，挡洪峰）──
        # rate=1000/s capacity=3000，进 Java 的总量受控；单用户防刷交给业务滑动窗口
        location ~ ^/reservations/\d+$ {
            access_by_lua_block {
                local tb = require "token_bucket"
                local dict = ngx.shared.rate_limit
                local ok = tb.allow(dict, "reservation", 1000, 3000)
                if not ok then
                    ngx.status = 429
                    ngx.header["Content-Type"] = "application/json;charset=utf-8"
                    ngx.header["X-RateLimit-Layer"] = "gateway-global-token-bucket"
                    ngx.say('{"success":false,"errorMsg":"系统繁忙，请稍后重试"}')
                    return ngx.exit(429)
                end
            }

            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 场馆查询接口，走 Lua 缓存 ──
        location ~ ^/venues/(\d+)$ {
            default_type application/json;

            access_by_lua_block {
                local cache = ngx.shared.venue_cache
                local key   = ngx.var.uri
                local data  = cache:get(key)

                if data then
                    ngx.header["X-Cache-Hit"] = "OpenResty-L1"
                    ngx.say(data)
                    ngx.exit(200)
                end
            }

            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Cache-Miss "OpenResty";

            body_filter_by_lua_block {
                local cache  = ngx.shared.venue_cache
                local key    = ngx.var.uri
                local status = ngx.status
                local chunk  = ngx.arg[1]
                local eof    = ngx.arg[2]

                if status == 200 and chunk then
                    ngx.ctx.response_body = (ngx.ctx.response_body or "") .. chunk
                end
                if eof and status == 200 and ngx.ctx.response_body
                   and #ngx.ctx.response_body <= 1048576 then
                    local ttl = 600 + math.random(-60, 60)
                    cache:set(key, ngx.ctx.response_body, ttl)
                end
            }
        }

        # 由 Java 写路径和 Canal 消费者调用；仅允许本机与容器私网。
        location = /internal/cache/venue {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            content_by_lua_block {
                if ngx.req.get_method() ~= "DELETE" then
                    return ngx.exit(405)
                end
                local id = ngx.var.arg_id
                if not id or not string.match(id, "^%d+$") then
                    return ngx.exit(400)
                end
                ngx.shared.venue_cache:delete("/venues/" .. id)
                ngx.status = 204
                return ngx.exit(204)
            }
        }

        location /venues/update {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
