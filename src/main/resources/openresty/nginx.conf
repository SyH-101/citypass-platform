# ============================================================
# OpenResty 配置 — L1 缓存 + 网关令牌桶（二级限流第一层）
# 部署：将 lua/ 放到 OpenResty 可读路径，修改 lua_package_path 后 reload
# ============================================================

worker_processes  4;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

# Read-side anti-scan threshold is independent from the reservation limiter.
env VENUE_READ_RATE_PER_SECOND;
env VENUE_READ_BURST;

events {
    worker_connections  10240;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/json;

    # ── 共享字典 ──
    lua_shared_dict venue_cache   128m;
    # 场馆缓存的最低可接受版本；使用 safe_set，容量不足时显式失败而非 LRU 淘汰水位。
    lua_shared_dict venue_cache_version 16m;
    lua_shared_dict lock_dict     16m;
    # 网关令牌桶状态（按 IP）
    lua_shared_dict rate_limit    16m;
    # Venue 详情读限流使用独立字典，避免与预约入口共享容量和状态。
    lua_shared_dict venue_read_rate_limit 16m;

    # ── Lua 脚本路径（按实际部署目录调整）──
    # 开发可将本仓库 src/main/resources/openresty/lua 拷到机器上
    lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/openresty/nginx/lua/?.lua;;";

    upstream java_backend {
        server app:8081 weight=1;
        # server 127.0.0.1:8082 weight=1;
    }

    server {
        listen 80;

        # ── 限量预约入口：网关全局令牌桶（所有请求共一桶，挡洪峰）──
        # rate=1000/s capacity=3000，进 Java 的总量受控；单用户防刷交给业务滑动窗口
        location ~ ^/reservations/\d+$ {
            access_by_lua_block {
                local tb = require "token_bucket"
                local dict = ngx.shared.rate_limit
                local ok = tb.allow(dict, "reservation", 1000, 3000)
                if not ok then
                    ngx.status = 429
                    ngx.header["Content-Type"] = "application/json;charset=utf-8"
                    ngx.header["X-RateLimit-Layer"] = "gateway-global-token-bucket"
                    ngx.say('{"success":false,"errorMsg":"系统繁忙，请稍后重试"}')
                    return ngx.exit(429)
                end
            }

            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 场馆查询接口，走 Lua 缓存 ──
        location ~ ^/venues/(?<venue_id>\d+)$ {
            default_type application/json;

            access_by_lua_block {
                -- 查询参数将来可能改变业务语义，因此只有无 query string 的精确 GET 才缓存。
                if ngx.req.get_method() ~= "GET" or (ngx.var.args and ngx.var.args ~= "") then
                    return
                end

                -- null marker protects repeated missing IDs; this per-IP bucket bounds random-ID scans.
                local tb = require "token_bucket"
                local rate = tonumber(os.getenv("VENUE_READ_RATE_PER_SECOND")) or 60
                local burst = tonumber(os.getenv("VENUE_READ_BURST")) or 120
                if rate < 1 then rate = 60 end
                if burst < 1 then burst = 120 end
                local rate_dict = ngx.shared.venue_read_rate_limit
                local client = ngx.var.remote_addr or "unknown"
                local allowed = tb.allow(rate_dict, "venue-read:" .. client, rate, burst)
                if not allowed then
                    rate_dict:incr("metric:gateway.venue.rate_limited", 1, 0)
                    ngx.log(ngx.WARN, "gateway.venue.rate_limited client=", client,
                            ", venueId=", ngx.var.venue_id)
                    ngx.status = 429
                    ngx.header["Content-Type"] = "application/json;charset=utf-8"
                    ngx.header["X-RateLimit-Layer"] = "gateway-venue-read"
                    ngx.say('{"success":false,"errorMsg":"查看过于频繁，请稍后重试"}')
                    return ngx.exit(429)
                end

                ngx.ctx.venue_cache_candidate = true
                ngx.ctx.venue_id = ngx.var.venue_id

                local venue_cache = require "venue_cache"
                local body, version = venue_cache.lookup(ngx.ctx.venue_id)
                if body then
                    ngx.ctx.venue_cache_hit = true
                    ngx.status = 200
                    ngx.header["Content-Type"] = "application/json;charset=utf-8"
                    ngx.header["X-Cache-Hit"] = "HIT"
                    ngx.header["X-Cache-Layer"] = "OpenResty-L1"
                    ngx.header["X-Cache-Version"] = tostring(version)
                    ngx.header["X-Venue-Cache-Version"] = tostring(version)
                    ngx.print(body)
                    return ngx.exit(200)
                end
            }

            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Cache-Miss "OpenResty";

            header_filter_by_lua_block {
                -- Never expose the Java-to-gateway cacheability trust signal to clients.
                ngx.header["X-Gateway-Cacheable"] = nil
                if ngx.ctx.venue_cache_candidate and not ngx.ctx.venue_cache_hit then
                    ngx.header["X-Cache-Hit"] = "MISS"
                    ngx.header["X-Cache-Layer"] = "OpenResty-L1"
                    local version = tonumber(ngx.var.upstream_http_x_venue_cache_version)
                    if version then
                        ngx.header["X-Cache-Version"] = tostring(version)
                    end
                end
            }

            body_filter_by_lua_block {
                if not ngx.ctx.venue_cache_candidate or ngx.ctx.venue_cache_hit then
                    return
                end

                if ngx.ctx.cacheability_checked == nil then
                    ngx.ctx.cacheability_checked = true
                    local cache_control = string.lower(ngx.var.upstream_http_cache_control or "")
                    local content_type = string.lower(ngx.var.upstream_http_content_type or "")
                    ngx.ctx.response_version = tonumber(ngx.var.upstream_http_x_venue_cache_version)
                    ngx.ctx.response_cacheable = ngx.status == 200
                        and ngx.var.upstream_http_x_gateway_cacheable == "1"
                        and ngx.ctx.response_version ~= nil
                        and ngx.ctx.response_version >= 0
                        and ngx.var.upstream_http_set_cookie == nil
                        and string.find(content_type, "application/json", 1, true) ~= nil
                        and string.find(cache_control, "private", 1, true) == nil
                        and string.find(cache_control, "no-store", 1, true) == nil
                end

                if not ngx.ctx.response_cacheable then
                    return
                end

                local chunk = ngx.arg[1]
                local eof = ngx.arg[2]
                if chunk and chunk ~= "" and not ngx.ctx.response_too_large then
                    local size = (ngx.ctx.response_size or 0) + #chunk
                    ngx.ctx.response_size = size
                    if size > 1048576 then
                        ngx.ctx.response_too_large = true
                        ngx.ctx.response_chunks = nil
                    else
                        local chunks = ngx.ctx.response_chunks or {}
                        chunks[#chunks + 1] = chunk
                        ngx.ctx.response_chunks = chunks
                    end
                end
                if eof and not ngx.ctx.response_too_large and ngx.ctx.response_chunks then
                    local venue_cache = require "venue_cache"
                    venue_cache.store(
                        ngx.ctx.venue_id,
                        ngx.ctx.response_version,
                        table.concat(ngx.ctx.response_chunks),
                        600 + math.random(-60, 60)
                    )
                end
            }
        }

        # 由 Java 写路径和 Canal 消费者调用；仅允许本机与容器私网。
        location = /internal/cache/venue {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            content_by_lua_block {
                if ngx.req.get_method() ~= "DELETE" then
                    return ngx.exit(405)
                end
                local id = ngx.var.arg_id
                local version_text = ngx.var.arg_version
                if not id or not string.match(id, "^%d+$")
                   or not version_text or not string.match(version_text, "^%d+$") then
                    return ngx.exit(400)
                end
                local venue_cache = require "venue_cache"
                local watermark, err = venue_cache.purge(id, tonumber(version_text))
                if not watermark then
                    ngx.log(ngx.ERR, "venue cache purge failed: id=", id,
                            ", version=", version_text, ", error=", err or "unknown")
                    return ngx.exit(503)
                end
                ngx.header["X-Gateway-Cache-Watermark"] = tostring(watermark)
                ngx.status = 204
                return ngx.exit(204)
            }
        }

        location /venues/update {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
