server:
  port: 8081
citypass:
  upload-dir: ${CITYPASS_UPLOAD_DIR:./data/images}
spring:
  autoconfigure:
    # 搜索模块自行按 search.enabled 创建客户端，避免关闭模块时 Boot 仍连接 localhost:9200。
    exclude: org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
  application:
    name: citypass
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/citypass?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: ${REDIS_COMMAND_TIMEOUT:1s}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
mybatis-plus:
  type-aliases-package: com.citypass.entity
# ===== RocketMQ 消息队列 =====
rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
canal:
  enabled: ${CANAL_ENABLED:false}
gateway-cache:
  # 多个地址用逗号分隔；每个网关都确认成功后可靠任务才完成。
  purge-urls: ${GATEWAY_CACHE_PURGE_URLS:}
  # 兼容旧的单地址配置；与 purge-urls 合并去重。
  purge-url: ${GATEWAY_CACHE_PURGE_URL:}
cache:
  reliability:
    # Redis 连续异常达到阈值后短暂 OPEN，冷却后只允许一个 HALF_OPEN 探测。
    redis-failure-threshold: ${CACHE_REDIS_FAILURE_THRESHOLD:3}
    redis-open-duration-ms: ${CACHE_REDIS_OPEN_DURATION_MS:3000}
    redis-command-timeout-ms: ${CACHE_REDIS_COMMAND_TIMEOUT_MS:1000}
    # 每个 JVM 的降级 DB 并发上限；tryAcquire 失败直接返回 503，不排队。
    db-fallback-max-concurrency: ${CACHE_DB_FALLBACK_MAX_CONCURRENCY:8}
    lock-wait-attempts: ${CACHE_LOCK_WAIT_ATTEMPTS:20}
    lock-wait-min-delay-ms: ${CACHE_LOCK_WAIT_MIN_DELAY_MS:25}
    lock-wait-max-delay-ms: ${CACHE_LOCK_WAIT_MAX_DELAY_MS:50}
reliable-task:
  enabled: ${RELIABLE_TASK_ENABLED:true}
  fixed-delay-ms: 1000
  batch-size: 50
  lease-seconds: 30
  max-retry: 12
  admin-token: ${RELIABLE_TASK_ADMIN_TOKEN:}
search:
  enabled: ${SEARCH_ENABLED:false}
  hosts: ${SEARCH_HOSTS:http://127.0.0.1:9200}
  alias: ${SEARCH_ALIAS:citypass-activity-search}
  cursor-secret: ${SEARCH_CURSOR_SECRET:}
  connect-timeout-ms: ${SEARCH_CONNECT_TIMEOUT_MS:1000}
  socket-timeout-ms: ${SEARCH_SOCKET_TIMEOUT_MS:3000}
  request-timeout-ms: ${SEARCH_REQUEST_TIMEOUT_MS:3000}
  pit-keep-alive-seconds: ${SEARCH_PIT_KEEP_ALIVE_SECONDS:60}
  max-page-size: ${SEARCH_MAX_PAGE_SIZE:50}
  max-radius-meters: ${SEARCH_MAX_RADIUS_METERS:50000}
  max-supplement-batches: ${SEARCH_MAX_SUPPLEMENT_BATCHES:3}
  rebuild-batch-size: ${SEARCH_REBUILD_BATCH_SIZE:200}
reservation:
  offer-minutes: ${RESERVATION_OFFER_MINUTES:15}
  reconcile:
    enabled: ${RESERVATION_RECONCILE_ENABLED:true}
  # 二级限流第二层：业务滑动窗口（第一层在 OpenResty 网关令牌桶）
  rate-limit:
    sliding-window:
      enabled: true
      window-ms: 1000      # 窗口 1 秒
      max-requests: 5      # 同一用户窗口内最多 5 次预约请求
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    com.citypass: info
