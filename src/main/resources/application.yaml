server:
  port: 8081
citypass:
  upload-dir: ${CITYPASS_UPLOAD_DIR:./data/images}
object-storage:
  provider: ${OBJECT_STORAGE_PROVIDER:minio}
  endpoint: ${OBJECT_STORAGE_ENDPOINT:http://127.0.0.1:9000}
  public-endpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
  region: ${OBJECT_STORAGE_REGION:us-east-1}
  bucket: ${OBJECT_STORAGE_BUCKET:citypass-story-files}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  timeout-seconds: ${OBJECT_STORAGE_TIMEOUT_SECONDS:10}
story-files:
  max-bytes: ${STORY_FILE_MAX_BYTES:10485760}
  max-pixels: ${STORY_FILE_MAX_PIXELS:20000000}
  max-dimension: ${STORY_FILE_MAX_DIMENSION:10000}
  max-images: ${STORY_FILE_MAX_IMAGES:9}
  pending-quota: ${STORY_FILE_PENDING_QUOTA:20}
  upload-seconds: ${STORY_FILE_UPLOAD_SECONDS:300}
  read-seconds: ${STORY_FILE_READ_SECONDS:120}
  draft-hours: ${STORY_FILE_DRAFT_HOURS:24}
  cleanup-grace-seconds: ${STORY_FILE_CLEANUP_GRACE_SECONDS:120}
  confirmation-lease-seconds: ${STORY_FILE_CONFIRMATION_LEASE_SECONDS:60}
  io-concurrency: ${STORY_FILE_IO_CONCURRENCY:4}
  tombstone-rescan-seconds: ${STORY_FILE_TOMBSTONE_RESCAN_SECONDS:3600}
  debug-page-enabled: ${STORY_DEBUG_PAGE_ENABLED:false}
spring:
  application:
    name: citypass
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/citypass?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: ${REDIS_COMMAND_TIMEOUT:1s}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
mybatis-plus:
  type-aliases-package: com.citypass.entity
# ===== RocketMQ 消息队列 =====
rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
canal:
  enabled: ${CANAL_ENABLED:false}
gateway-cache:
  # 多个地址用逗号分隔；每个网关都确认成功后可靠任务才完成。
  purge-urls: ${GATEWAY_CACHE_PURGE_URLS:}
  # 兼容旧的单地址配置；与 purge-urls 合并去重。
  purge-url: ${GATEWAY_CACHE_PURGE_URL:}
cache:
  reliability:
    # Redis 连续异常达到阈值后短暂 OPEN，冷却后只允许一个 HALF_OPEN 探测。
    redis-failure-threshold: ${CACHE_REDIS_FAILURE_THRESHOLD:3}
    redis-open-duration-ms: ${CACHE_REDIS_OPEN_DURATION_MS:3000}
    redis-command-timeout-ms: ${CACHE_REDIS_COMMAND_TIMEOUT_MS:1000}
    # 每个 JVM 的降级 DB 并发上限；tryAcquire 失败直接返回 503，不排队。
    db-fallback-max-concurrency: ${CACHE_DB_FALLBACK_MAX_CONCURRENCY:8}
    lock-wait-attempts: ${CACHE_LOCK_WAIT_ATTEMPTS:20}
    lock-wait-min-delay-ms: ${CACHE_LOCK_WAIT_MIN_DELAY_MS:25}
    lock-wait-max-delay-ms: ${CACHE_LOCK_WAIT_MAX_DELAY_MS:50}
reliable-task:
  enabled: ${RELIABLE_TASK_ENABLED:true}
  fixed-delay-ms: 1000
  batch-size: 50
  lease-seconds: 30
  max-retry: 12
  admin-token: ${RELIABLE_TASK_ADMIN_TOKEN:}
reservation:
  offer-minutes: ${RESERVATION_OFFER_MINUTES:15}
  reconcile:
    enabled: ${RESERVATION_RECONCILE_ENABLED:true}
  # 二级限流第二层：业务滑动窗口（第一层在 OpenResty 网关令牌桶）
  rate-limit:
    sliding-window:
      enabled: true
      window-ms: 1000      # 窗口 1 秒
      max-requests: 5      # 同一用户窗口内最多 5 次预约请求
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    com.citypass: info
