server:
  port: 8081
citypass:
  upload-dir: ${CITYPASS_UPLOAD_DIR:./data/images}
spring:
  application:
    name: citypass
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/citypass?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
mybatis-plus:
  type-aliases-package: com.citypass.entity
# ===== RocketMQ 消息队列 =====
rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
canal:
  enabled: ${CANAL_ENABLED:false}
gateway-cache:
  # 例如 http://127.0.0.1/internal/cache/venue；留空时只驱逐 Caffeine + Redis
  purge-url: ${GATEWAY_CACHE_PURGE_URL:}
reliable-task:
  enabled: ${RELIABLE_TASK_ENABLED:true}
  fixed-delay-ms: 1000
  batch-size: 50
  lease-seconds: 30
  max-retry: 12
  admin-token: ${RELIABLE_TASK_ADMIN_TOKEN:}
reservation:
  offer-minutes: ${RESERVATION_OFFER_MINUTES:15}
  reconcile:
    enabled: ${RESERVATION_RECONCILE_ENABLED:true}
  # 二级限流第二层：业务滑动窗口（第一层在 OpenResty 网关令牌桶）
  rate-limit:
    sliding-window:
      enabled: true
      window-ms: 1000      # 窗口 1 秒
      max-requests: 5      # 同一用户窗口内最多 5 次预约请求
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    com.citypass: info
